<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fdf2f8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#bg)" />

  <!-- Background decorative Kanji & Circles -->
  <circle cx="700" cy="80" r="140" fill="white" opacity="0.06" />
  <circle cx="100" cy="420" r="160" fill="white" opacity="0.05" />
  <text x="650" y="380" font-size="160" font-family="'Noto Sans JP', sans-serif" font-weight="900" fill="white" opacity="0.08">語</text>
  <text x="60" y="180" font-size="140" font-family="'Noto Sans JP', sans-serif" font-weight="900" fill="white" opacity="0.08">学</text>

  <!-- Center Card (Flashcard 3D) -->
  <g transform="translate(240, 70)" filter="url(#shadow)">
    <rect width="320" height="360" rx="24" fill="url(#cardGrad)" />
    
    <!-- Top badge -->
    <rect x="24" y="24" width="90" height="26" rx="8" fill="#fce7f3" />
    <text x="69" y="42" font-size="12" font-weight="bold" fill="#db2777" text-anchor="middle" font-family="system-ui, sans-serif">JLPT N5</text>
    
    <text x="296" y="44" font-size="20" text-anchor="end">🔥 12</text>
    
    <!-- Kanji -->
    <text x="160" y="145" font-size="20" font-family="'Noto Sans JP', sans-serif" fill="#db2777" text-anchor="middle">たべる</text>
    <text x="160" y="225" font-size="76" font-family="'Noto Sans JP', sans-serif" font-weight="bold" fill="#1e1b4b" text-anchor="middle">食べる</text>
    <text x="160" y="260" font-size="16" font-family="system-ui, sans-serif" fill="#6b7280" text-anchor="middle">taberu · Kata Kerja (Verb)</text>

    <!-- Meaning tag -->
    <rect x="40" y="290" width="240" height="42" rx="12" fill="#4f46e5" />
    <text x="160" y="316" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="system-ui, sans-serif">Arti: Makan</text>
  </g>

  <!-- Bottom App Title -->
  <text x="400" y="468" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="1.5">Kotoba Learn — Japanese JLPT &amp; Spaced Repetition</text>
</svg>
