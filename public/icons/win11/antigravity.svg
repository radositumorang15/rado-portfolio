<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 3D Cosmic Elevation Shadow -->
    <filter id="shadowAgy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Neon Glow Filter -->
    <filter id="neonAgyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Deep Space Base Gradient -->
    <linearGradient id="agyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2765" />
      <stop offset="45%" stop-color="#16143c" />
      <stop offset="100%" stop-color="#090b14" />
    </linearGradient>

    <!-- Top Rim Specular Gloss -->
    <linearGradient id="agyGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Holographic Chevron 3D Gradient -->
    <linearGradient id="agyHolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Core Orb Radial Gradient -->
    <radialGradient id="agyOrb" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
  </defs>

  <!-- Base Squircle with 3D Depth -->
  <g filter="url(#shadowAgy)">
    <rect x="12" y="12" width="104" height="104" rx="26" fill="url(#agyBg)" />
    <!-- Bottom Bevel -->
    <path d="M 12 88 C 12 104 24 116 40 116 L 88 116 C 104 116 116 104 116 88 L 116 82 C 116 98 104 110 88 110 L 40 110 C 24 110 12 98 12 82 Z" fill="#04050a" fill-opacity="0.7" />
    <!-- Top Specular Gloss Rim -->
    <rect x="13.5" y="13.5" width="101" height="50" rx="24.5" fill="url(#agyGloss)" />
    <rect x="12.5" y="12.5" width="103" height="103" rx="25.5" fill="none" stroke="rgba(129,140,248,0.3)" stroke-width="1.2" />
  </g>

  <!-- 3D Holographic Chevron Emblem with Celestial Aperture -->
  <g filter="url(#neonAgyGlow)" transform="translate(64, 64) scale(2.6) translate(-16, -16)">
    <!-- Outer Delta Prism -->
    <path d="M16 5.5 L26.5 25.5 H21.8 L16 14.2 L10.2 25.5 H5.5 L16 5.5 Z" fill="url(#agyHolo)" />
    
    <!-- Inner Dark Core Cavity -->
    <path d="M12.8 21.2 H19.2 L16 14 L12.8 21.2 Z" fill="#0b0e1b" opacity="0.9" />

    <!-- Levitating Zero-G Antigravity Energy Core -->
    <circle cx="16" cy="18.5" r="2.2" fill="url(#agyOrb)" />
    <circle cx="15.2" cy="17.7" r="0.6" fill="#FFFFFF" />
  </g>
</svg>

