<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 3D Outer Elevation Shadow -->
    <filter id="shadow3dSk" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4a0e4e" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Emblem 3D Depth Shadow -->
    <filter id="emblemShadowSk" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- 3D Fluent Violet / Fuchsia Gradient -->
    <linearGradient id="bodyGradSk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b026ff" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Top Rim Specular Gloss -->
    <linearGradient id="glossGradSk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Bottom Bevel Shadow -->
    <linearGradient id="bottomBevelSk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- 3D Base Tile -->
  <g filter="url(#shadow3dSk)">
    <rect x="12" y="12" width="104" height="104" rx="26" fill="url(#bodyGradSk)" />
    <!-- Bottom Bevel Thickness -->
    <path d="M 12 88 C 12 104 24 116 40 116 L 88 116 C 104 116 116 104 116 88 L 116 82 C 116 98 104 110 88 110 L 40 110 C 24 110 12 98 12 82 Z" fill="url(#bottomBevelSk)" />
    <!-- Top Highlight Rim -->
    <rect x="13.5" y="13.5" width="101" height="50" rx="24.5" fill="url(#glossGradSk)" />
    <!-- Top Inner Border -->
    <rect x="12.5" y="12.5" width="103" height="103" rx="25.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" />
  </g>

  <!-- 3D Modern CPU / Chip Skills Emblem -->
  <g filter="url(#emblemShadowSk)" fill="#FFFFFF">
    <!-- Center Square Die -->
    <rect x="42" y="42" width="44" height="44" rx="8" />
    <rect x="48" y="48" width="32" height="32" rx="4" fill="#6d28d9" />
    <circle cx="64" cy="64" r="7" fill="#FFFFFF" />

    <!-- Top Pins -->
    <rect x="48" y="27" width="6" height="11" rx="2" />
    <rect x="61" y="27" width="6" height="11" rx="2" />
    <rect x="74" y="27" width="6" height="11" rx="2" />

    <!-- Bottom Pins -->
    <rect x="48" y="90" width="6" height="11" rx="2" />
    <rect x="61" y="90" width="6" height="11" rx="2" />
    <rect x="74" y="90" width="6" height="11" rx="2" />

    <!-- Left Pins -->
    <rect x="27" y="48" width="11" height="6" rx="2" />
    <rect x="27" y="61" width="11" height="6" rx="2" />
    <rect x="27" y="74" width="11" height="6" rx="2" />

    <!-- Right Pins -->
    <rect x="90" y="48" width="11" height="6" rx="2" />
    <rect x="90" y="61" width="11" height="6" rx="2" />
    <rect x="90" y="74" width="11" height="6" rx="2" />
  </g>
</svg>
