<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 3D Outer Elevation Shadow -->
    <filter id="shadow3dTh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Emblem 3D Depth Shadow -->
    <filter id="emblemShadowTh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <!-- 3D Fluent Onyx Gradient -->
    <linearGradient id="bodyGradTh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c3c45" />
      <stop offset="45%" stop-color="#18181c" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>

    <!-- Top Rim Specular Gloss -->
    <linearGradient id="glossGradTh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Bottom Bevel Shadow -->
    <linearGradient id="bottomBevelTh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- 3D Base Tile -->
  <g filter="url(#shadow3dTh)">
    <rect x="12" y="12" width="104" height="104" rx="26" fill="url(#bodyGradTh)" />
    <!-- Bottom Bevel Thickness -->
    <path d="M 12 88 C 12 104 24 116 40 116 L 88 116 C 104 116 116 104 116 88 L 116 82 C 116 98 104 110 88 110 L 40 110 C 24 110 12 98 12 82 Z" fill="url(#bottomBevelTh)" />
    <!-- Top Highlight Rim -->
    <rect x="13.5" y="13.5" width="101" height="50" rx="24.5" fill="url(#glossGradTh)" />
    <!-- Top Inner Border -->
    <rect x="12.5" y="12.5" width="103" height="103" rx="25.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" />
  </g>

  <!-- 3D Threads White Glyph Emblem -->
