<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="chromeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <linearGradient id="cRed" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="60%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#C5221F" />
    </linearGradient>
    <linearGradient id="cYellow" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD043" />
      <stop offset="60%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#E37400" />
    </linearGradient>
    <linearGradient id="cGreen" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0D652D" />
      <stop offset="50%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#5BB974" />
    </linearGradient>
    <radialGradient id="cBlue" cx="38%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#6BA5FF" />
      <stop offset="50%" stop-color="#1A73E8" />
      <stop offset="100%" stop-color="#1557B0" />
    </radialGradient>
    <linearGradient id="cGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <g filter="url(#chromeShadow)">
    <!-- Red Arc -->
    <path d="M64 12 C78.8 12 92.1 17.8 101.8 27.2 L74.4 74.6 C71.6 71.8 67.9 70 64 70 C60.1 70 56.4 71.8 53.6 74.6 L26.2 27.2 C35.9 17.8 49.2 12 64 12 Z" fill="url(#cRed)" />
    <!-- Yellow Arc -->
    <path d="M101.8 27.2 C111.4 36.9 116 50.1 116 64 C116 84.8 104 102.7 86.8 111.2 L59.4 63.8 C62.2 61 64 57.3 64 53.4 C64 49.5 62.2 45.8 59.4 43 L101.8 27.2 Z" fill="url(#cYellow)" />
    <!-- Green Arc -->
    <path d="M26.2 27.2 L53.6 74.6 C50.8 77.4 49 81.1 49 85 C49 93.3 55.7 100 64 100 L41.2 111.2 C24 102.7 12 84.8 12 64 C12 50.1 16.6 36.9 26.2 27.2 Z" fill="url(#cGreen)" />

    <!-- Pure Circle Divider -->
    <g transform="translate(64, 64) scale(3.5) translate(-16, -16)">
      <path d="M16 4 C20.3 4 24.1 6.2 26.2 9.7 L20.1 20.3 C19.2 19.3 17.7 18.6 16 18.6 H4.5 C5.8 10.3 12.8 4 16 4 Z" fill="url(#cRed)" />
      <path d="M27.5 13 C28.2 14.8 28.6 16.7 28.6 18.7 C28.6 24.7 24.5 29.8 19 31.3 L12.9 20.7 C13.7 21.4 14.8 21.8 16 21.8 C17.9 21.8 19.5 20.6 20.1 18.8 L27.5 13 Z" fill="url(#cYellow)" />
      <path d="M4.5 18.6 H17.1 L11 29.2 C6.2 27.2 3.1 22.2 3.1 16.4 C3.1 14.5 3.5 12.6 4.3 10.9 L10.4 21.4 C10.6 22.7 11.6 23.7 12.8 24 L4.5 18.6 Z" fill="url(#cGreen)" />
      
      <!-- White Ring -->
      <circle cx="16" cy="16" r="6.8" fill="#FFFFFF" />
      <!-- Center Blue Sphere -->
      <circle cx="16" cy="16" r="5.2" fill="url(#cBlue)" />
      <circle cx="14.4" cy="14.4" r="1.5" fill="#FFFFFF" opacity="0.6" />
