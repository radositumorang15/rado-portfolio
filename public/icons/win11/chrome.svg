<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Outer Elevation Shadow -->
    <filter id="shadowChrome" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <!-- Inner Sphere Depth Shadow -->
    <filter id="sphereShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Squircle Tile Gradient -->
    <linearGradient id="chromeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Top Highlight -->
    <linearGradient id="chromeGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Red pinwheel gradient with 3D curve -->
    <linearGradient id="chromeRed" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="60%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#C5221F" />
    </linearGradient>

    <!-- Yellow pinwheel gradient -->
    <linearGradient id="chromeYellow" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD043" />
      <stop offset="60%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#E37400" />
    </linearGradient>

    <!-- Green pinwheel gradient -->
    <linearGradient id="chromeGreen" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0D652D" />
      <stop offset="50%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#5BB974" />
    </linearGradient>

    <!-- Blue spherical center lens -->
    <radialGradient id="chromeCenterBlue" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6BA5FF" />
      <stop offset="60%" stop-color="#1A73E8" />
      <stop offset="100%" stop-color="#1557B0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Tile -->
  <g filter="url(#shadowChrome)">
    <rect x="12" y="12" width="104" height="104" rx="26" fill="url(#chromeBg)" />
    <!-- Top Rim Gloss -->
    <rect x="13.5" y="13.5" width="101" height="50" rx="24.5" fill="url(#chromeGloss)" />
    <rect x="12.5" y="12.5" width="103" height="103" rx="25.5" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.2" />
  </g>

  <!-- 3D Chrome Wheel with depth -->
  <g filter="url(#sphereShadow)">
    <g transform="translate(64, 64) scale(2.4) translate(-16, -16)">
      <!-- Top Red Arc -->
      <path d="M16 5C19.8 5 23.2 7 25 10.2L19.4 19.8C18.6 18.7 17.4 18 16 18H5.5C6.7 10.5 13.2 5 16 5Z" fill="url(#chromeRed)" />
      <!-- Right Yellow Arc -->
      <path d="M26.8 13.5C27.6 15.2 28 17 28 19C28 24.5 24.3 29.1 19.3 30.5L13.8 21C14.5 21.6 15.4 22 16.5 22C18.2 22 19.7 20.9 20.3 19.3L26.8 13.5Z" fill="url(#chromeYellow)" />
      <!-- Bottom-Left Green Arc -->
      <path d="M5.5 18H16.8L11.2 27.6C6.8 25.8 4 21.3 4 16C4 14.3 4.4 12.6 5.1 11L10.6 20.5C10.8 21.6 11.7 22.5 12.8 22.8L5.5 18Z" fill="url(#chromeGreen)" />
      
      <!-- White Ring Divider with 3D specular edge -->
      <circle cx="16" cy="16" r="6.2" fill="#FFFFFF" />
      
      <!-- Blue Inner Orb with Spherical Specular Light -->
      <circle cx="16" cy="16" r="4.6" fill="url(#chromeCenterBlue)" />
      <!-- Specular pinpoint on blue circle -->
      <circle cx="14.5" cy="14.5" r="1.2" fill="#FFFFFF" opacity="0.6" />
    </g>
  </g>
</svg>

