<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Outer 3D Drop Shadow -->
    <filter id="shadowVSCode" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#002b50" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Fold Crease Shadow for 3D Ribbons -->
    <filter id="creaseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1" dy="2" stdDeviation="2" flood-color="#001830" flood-opacity="0.6" />
    </filter>

    <!-- Background Base Squircle Gradient -->
    <linearGradient id="vscodeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f242e" />
      <stop offset="50%" stop-color="#12161f" />
      <stop offset="100%" stop-color="#090c12" />
    </linearGradient>

    <!-- Specular Highlight for Base Tile -->
    <linearGradient id="vscodeGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Ribbon Gradients (Fluent 3D Origami Shades) -->
    <!-- 1. Left Lower Ribbon (Dark Cyan-Blue) -->
    <linearGradient id="vsRibbonLeftLow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005A9E" />
      <stop offset="100%" stop-color="#003B66" />
    </linearGradient>

    <!-- 2. Left Upper Ribbon -->
    <linearGradient id="vsRibbonLeftUp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007ACC" />
      <stop offset="100%" stop-color="#004D80" />
    </linearGradient>

    <!-- 3. Crossing Ribbons (Electric Vibrant Cyan-Blue) -->
    <linearGradient id="vsRibbonCross1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F9CF0" />
      <stop offset="100%" stop-color="#0078D4" />
    </linearGradient>

    <linearGradient id="vsRibbonCross2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0098FF" />
    </linearGradient>

    <!-- 4. Front Edge Crest -->
    <linearGradient id="vsRibbonFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60CDFF" />
      <stop offset="50%" stop-color="#23A9FA" />
      <stop offset="100%" stop-color="#0078D4" />
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <g filter="url(#shadowVSCode)">
    <rect x="12" y="12" width="104" height="104" rx="26" fill="url(#vscodeBg)" />
    <!-- Bottom Bevel -->
    <path d="M 12 88 C 12 104 24 116 40 116 L 88 116 C 104 116 116 104 116 88 L 116 82 C 116 98 104 110 88 110 L 40 110 C 24 110 12 98 12 82 Z" fill="#000000" fill-opacity="0.6" />
    <!-- Top Rim Gloss -->
    <rect x="13.5" y="13.5" width="101" height="50" rx="24.5" fill="url(#vscodeGloss)" />
    <rect x="12.5" y="12.5" width="103" height="103" rx="25.5" fill="none" stroke="rgba(56,189,248,0.22)" stroke-width="1.2" />
  </g>

  <!-- 3D Ribbon Emblem -->
  <g transform="translate(64, 64) scale(2.7) translate(-16, -16)">
    <!-- Back Crossing Fold -->
    <path d="M23.5 4.5 L16.2 11.2 L9.8 6.2 L6 8.2 V23.8 L9.8 25.8 L16.2 20.8 L23.5 27.5 L27 25.5 V6.5 Z" fill="url(#vsRibbonLeftLow)" />
    
    <!-- Left Flap Fold -->
    <path d="M6 8.2 L16.2 16 L6 23.8 Z" fill="url(#vsRibbonLeftUp)" opacity="0.8" />
    
    <!-- Front Diagonal Ribbon Cross Lower -->
    <path d="M9.8 25.8 L23.5 16 L9.8 6.2 L16.2 16 Z" fill="url(#vsRibbonCross1)" filter="url(#creaseShadow)" />

    <!-- Front Diagonal Ribbon Cross Upper -->
    <path d="M23.5 4.5 L16.2 11.2 L23.5 16 Z" fill="url(#vsRibbonCross2)" />
    
    <!-- Right Fold Infinity Shield -->
    <path d="M23.5 4.5 L23.5 27.5 L27 25.5 V6.5 Z" fill="url(#vsRibbonFront)" />
  </g>
</svg>

