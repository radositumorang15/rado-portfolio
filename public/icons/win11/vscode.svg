<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="vscShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5.5" flood-color="#002b50" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <linearGradient id="vscLeftLow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005A9E" />
      <stop offset="100%" stop-color="#003B66" />
    </linearGradient>
    <linearGradient id="vscLeftUp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007ACC" />
      <stop offset="100%" stop-color="#004D80" />
    </linearGradient>
    <linearGradient id="vscCross1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F9CF0" />
      <stop offset="100%" stop-color="#0078D4" />
    </linearGradient>
    <linearGradient id="vscCross2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0098FF" />
    </linearGradient>
  </defs>

  <g filter="url(#vscShadow)">
    <g transform="translate(64, 64) scale(0.95) translate(-64, -64)">
      <!-- 1. Right Main Blue Wing -->
      <path d="M96 22 L35 72 L18 58 L96 22 Z" fill="url(#vscCross1)" />
      <!-- 2. Bottom Fold -->
      <path d="M18 58 L35 72 L18 86 C15.5 84 14 81 14 78 L14 66 C14 63 15.5 60 18 58 Z" fill="url(#vscLeftLow)" />
      <!-- 3. Top Fold -->
      <path d="M18 58 L18 42 C14 44 14 48 14 50 L14 66 C14 63 15.5 60 18 58 Z" fill="url(#vscLeftUp)" />
      <!-- 4. Crossing Top-to-Bottom Diagonal Ribbon -->
      <path d="M96 106 L35 56 L18 70 L96 106 Z" fill="url(#vscCross2)" />
      <!-- 5. Right Spine Cover -->
      <path d="M96 22 C101 20 106 23 108 27 L113 37 C114 40 114 88 113 91 L108 101 C106 105 101 108 96 106 L82 95 L98 64 L82 33 L96 22 Z" fill="#0066B8" />
    </g>
  </g>
</svg>