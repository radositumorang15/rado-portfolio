<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Outer Elevation Drop Shadow -->
    <filter id="ghShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5.5" flood-color="#3b0764" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <!-- Emblem Inner Drop Shadow -->
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#2e1065" flood-opacity="0.4" />
    </filter>
    <!-- Official GitHub Desktop Brand Purple Gradient -->
    <linearGradient id="ghPurpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="45%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>
    <!-- Top Rim Specular Gloss -->
    <linearGradient id="ghGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <!-- Bottom Bevel Thickness -->
    <linearGradient id="ghBottomBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#240747" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- 3D Base Tile with Elevation -->
  <g filter="url(#ghShadow)">
    <rect x="14" y="14" width="100" height="100" rx="24" fill="url(#ghPurpleBg)" />
    <!-- Bottom Bevel -->
    <path d="M 14 88 C 14 102 26 114 40 114 L 88 114 C 102 114 114 102 114 88 L 114 84 C 114 98 102 110 88 110 L 40 110 C 26 110 14 98 14 84 Z" fill="url(#ghBottomBevel)" />
    <!-- Top Highlight Rim -->
    <rect x="15.5" y="15.5" width="97" height="48" rx="22.5" fill="url(#ghGloss)" />
    <!-- Top Inner Border -->
    <rect x="14.5" y="14.5" width="99" height="99" rx="23.5" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" />
  </g>

  <!-- Crisp 3D Octocat White Emblem -->
  <g filter="url(#emblemShadow)" fill="#FFFFFF">
    <path d="M64 28C44.11 28 28 44.11 28 64c0 15.91 10.32 29.36 24.62 34.12 1.8.31 2.47-.77 2.47-1.72 0-.85-.05-3.68-.05-6.7-9.05 1.67-11.39-2.2-12.12-4.23-.41-1.03-2.16-4.23-3.69-5.08-1.26-.67-3.06-2.34-.05-2.38 2.84-.05 4.86 2.61 5.54 3.69 3.24 5.44 8.41 3.92 10.49 2.97.31-2.34 1.26-3.92 2.29-4.82-8.01-.9-16.39-4-16.39-17.78 0-3.92 1.39-7.16 3.69-9.67-.36-.9-1.62-4.59.36-9.54 0 0 3.02-.95 9.9 3.69 2.88-.81 5.94-1.21 9-1.21 3.06 0 6.12.41 9 1.21 6.89-4.68 9.9-3.69 9.9-3.69 1.98 4.95.72 8.64.36 9.54 2.3 2.52 3.69 5.72 3.69 9.67 0 13.82-8.42 16.87-16.43 17.78 1.31 1.13 2.43 3.28 2.43 6.66 0 4.82-.05 8.69-.05 9.9 0 .99.67 2.07 2.48 1.71C89.68 93.36 100 79.91 100 64c0-19.89-16.09-36-36-36z" />
  </g>
</svg>