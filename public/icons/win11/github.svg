<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 3D Outer Elevation Shadow -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.30" />
    </filter>

    <!-- Emblem Inner Drop Shadow for 3D depth -->
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- 3D Fluent Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#404752" />
      <stop offset="45%" stop-color="#24292f" />
      <stop offset="100%" stop-color="#14181e" />
    </linearGradient>

    <!-- Top Rim Specular Gloss -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Bottom Bevel Shadow -->
    <linearGradient id="bottomBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#090b0e" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- 3D Base Tile with Elevation -->
  <g filter="url(#shadow3d)">
    <rect x="12" y="12" width="104" height="104" rx="26" fill="url(#bodyGrad)" />
    <!-- Bottom Bevel Thickness -->
    <path d="M 12 88 C 12 104 24 116 40 116 L 88 116 C 104 116 116 104 116 88 L 116 82 C 116 98 104 110 88 110 L 40 110 C 24 110 12 98 12 82 Z" fill="url(#bottomBevel)" />
    <!-- Top Highlight Rim -->
    <rect x="13.5" y="13.5" width="101" height="50" rx="24.5" fill="url(#glossGrad)" />
    <!-- Top Inner Border -->
    <rect x="12.5" y="12.5" width="103" height="103" rx="25.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" />
  </g>

  <!-- 3D Octocat White Emblem -->
  <g filter="url(#emblemShadow)" fill="#FFFFFF">
    <path d="M64 26C42.99 26 26 42.99 26 64c0 16.81 10.9 31.02 26.01 36.05 1.9.33 2.61-.81 2.61-1.81 0-.9-.05-3.89-.05-7.08-9.56 1.76-12.03-2.33-12.8-4.47-.43-1.09-2.28-4.47-3.9-5.37-1.33-.71-3.23-2.47-.05-2.52 3-.05 5.14 2.76 5.85 3.9 3.42 5.75 8.89 4.14 11.08 3.14.33-2.47 1.33-4.14 2.42-5.09-8.46-.95-17.31-4.23-17.31-18.78 0-4.14 1.47-7.56 3.9-10.22-.38-.95-1.71-4.85.38-10.08 0 0 3.19-1 10.46 3.9 3.04-.86 6.28-1.28 9.51-1.28 3.23 0 6.47.43 9.51 1.28 7.27-4.94 10.46-3.9 10.46-3.9 2.09 5.23.76 9.13.38 10.08 2.43 2.66 3.9 6.04 3.9 10.22 0 14.6-8.9 17.82-17.36 18.78 1.38 1.19 2.57 3.47 2.57 7.04 0 5.09-.05 9.18-.05 10.46 0 1.05.71 2.19 2.62 1.81C91.1 95 102 80.76 102 64c0-21.01-16.99-38-38-38z" />
  </g>
</svg>
