<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 3D Outer Elevation Shadow -->
    <filter id="shadow3dLi" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#003366" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Emblem 3D Depth Shadow -->
    <filter id="emblemShadowLi" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#002b5c" flood-opacity="0.5" />
    </filter>

    <!-- 3D Fluent Blue Gradient -->
    <linearGradient id="bodyGradLi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b9df8" />
      <stop offset="45%" stop-color="#0a66c2" />
      <stop offset="100%" stop-color="#00458f" />
    </linearGradient>

    <!-- Top Rim Specular Gloss -->
    <linearGradient id="glossGradLi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Bottom Bevel Shadow -->
    <linearGradient id="bottomBevelLi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#00244d" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- 3D Base Tile -->
  <g filter="url(#shadow3dLi)">
    <rect x="12" y="12" width="104" height="104" rx="26" fill="url(#bodyGradLi)" />
    <!-- Bottom Bevel Thickness -->
    <path d="M 12 88 C 12 104 24 116 40 116 L 88 116 C 104 116 116 104 116 88 L 116 82 C 116 98 104 110 88 110 L 40 110 C 24 110 12 98 12 82 Z" fill="url(#bottomBevelLi)" />
    <!-- Top Highlight Rim -->
    <rect x="13.5" y="13.5" width="101" height="50" rx="24.5" fill="url(#glossGradLi)" />
    <!-- Top Inner Border -->
    <rect x="12.5" y="12.5" width="103" height="103" rx="25.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" />
  </g>

  <!-- 3D "in" White Lettermark Emblem -->
  <g filter="url(#emblemShadowLi)" fill="#FFFFFF">
    <circle cx="39" cy="39" r="8.5" />
    <rect x="30.5" y="52" width="17" height="46" rx="3.5" />
    <path d="M57.5 52 H73.5 V58.5 C76 53.5 83 50 92 50 C106.5 50 113.5 59.5 113.5 76 V98 H96.5 V78.5 C96.5 70 93.5 65.5 86.5 65.5 C79 65.5 74.5 70.5 74.5 79.5 V98 H57.5 V52 Z" />
  </g>
</svg>
